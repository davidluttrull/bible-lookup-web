<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bible Lookup</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%235E5653'/%3E%3Cpath d='M16 9c-2.5-1.6-5.5-2-8-1.5v15c2.5-.5 5.5-.1 8 1.5 2.5-1.6 5.5-2 8-1.5v-15c-2.5-.5-5.5-.1-8 1.5zm0 0v15' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="bar" id="bar">
    <a class="brand" href="/" id="brand" aria-label="Bible Lookup home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 9c-2.5-1.6-5.5-2-8-1.5v15c2.5-.5 5.5-.1 8 1.5 2.5-1.6 5.5-2 8-1.5v-15c-2.5-.5-5.5-.1-8 1.5zm0 0v15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Bible Lookup</span>
    </a>
    <form class="search" id="search" role="search" autocomplete="off">
      <input id="q" name="q" type="search" placeholder="Search" aria-label="Bible reference, like John 3:16" spellcheck="false" autocapitalize="off">
      <label class="tpick">
        <span class="sr">Translation</span>
        <select id="t" aria-label="Translation"></select>
        <span class="tpick-label" id="t-label">KJV</span>
        <svg class="chev" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 7.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </label>
      <button class="go" type="submit" aria-label="Look up passage">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </form>
  </header>

  <main id="main" class="main" hidden></main>

  <script src="/static/app.js"></script>
</body>
</html>
